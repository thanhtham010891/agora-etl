apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Order PostgreSQL
    uid: order-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: agora
    database: agora_demo
    jsonData:
      postgresVersion: 1600
      sslmode: disable
    secureJsonData:
      password: agora
    editable: false
