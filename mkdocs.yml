site_name: Agora ETL
site_description: Async-first ETL framework for Python
site_url: https://agora.my-working.com/
repo_url: https://github.com/thanhtham010891/agora-etl
repo_name: thanhtham010891/agora-etl
docs_dir: docs
theme:
  name: readthedocs
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Change Log:
      - Overview: change-log/index.md
      - 0.1.4: change-log/0.1.4.md
      - 0.1.3: change-log/0.1.3.md
      - 0.1.2: change-log/0.1.2.md
      - 0.1.0: change-log/0.1.0.md
  - Configuration: configuration.md
  - CLI Reference: cli.md
  - Benchmark:
      - Overview: benchmark/index.md
      - Matrix: benchmark/matrix.md
  - Sources: sources.md
  - Sinks: sinks.md
  - Middlewares: middlewares.md
  - Runner: runner.md
  - Plugins: plugins.md
  - Architecture: architecture.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
