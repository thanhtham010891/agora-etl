  - Guides:
      - Quickstart: guides/quickstart.md
      - Pipelines: guides/pipelines.md
      - Runtime Guarantees: guides/runtime-guarantees.md
      - Failure Handling: guides/failure-handling.md
      - Checkpointing: guides/checkpointing.md
      - Recovery Matrix: guides/recovery-matrix.md
      - Scheduling: guides/scheduling.md
      - Testing: guides/testing.md
      - Observability: guides/observability.md
      - Configuration: configuration.md
      - CLI Reference: cli.md
  - Reference:
      - Sources: sources.md
      - Sinks: sinks.md
      - Middlewares: middlewares.md
      - Architecture: architecture.md
      - Plugins:
          - Overview: plugins/index.md
          - Official Bundle: plugins/official-bundle.md
          - Redis: plugins/redis.md
          - Kafka: plugins/kafka.md
          - PostgreSQL: plugins/postgresql.md
          - Scheduling: plugins/scheduling.md
          - Distributed Coordination: plugins/distributed.md
          - Developing Plugins: plugins/developing.md
  - Benchmark:
      - Overview: benchmark/index.md
      - Core: benchmark/core.md
      - Kafka: benchmark/kafka.md
      - Redis: benchmark/redis.md
  - Change Log: change-log/index.md
markdown_extensions:
  - admonition
  - tables
  - toc:
