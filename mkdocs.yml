site_name: Agora ETL
site_description: Async-first ETL framework for Python
site_url: https://agora.my-working.com/
repo_url: https://github.com/thanhtham010891/agora-etl
repo_name: thanhtham010891/agora-etl
docs_dir: docs
theme:
  name: readthedocs
extra_css:
  - stylesheets/layout.css
nav:
  - Home: index.md
  - Guides:
      - Getting Started: getting-started.md
      - Configuration: configuration.md
      - CLI Reference: cli.md
      - Runner: runner.md
  - Benchmark:
      - Overview: benchmark/index.md
      - Matrix: benchmark/matrix.md
  - Reference:
      - Sources: sources.md
      - Sinks: sinks.md
      - Middlewares: middlewares.md
      - Plugins:
          - Overview: plugins/index.md
          - Official Bundle: plugins/official-bundle.md
          - Redis: plugins/redis.md
          - Kafka: plugins/kafka.md
          - PostgreSQL: plugins/postgresql.md
          - Scheduling: plugins/scheduling.md
          - Distributed Coordination: plugins/distributed.md
          - Developing Plugins: plugins/developing.md
      - Architecture: architecture.md
  - Change Log: change-log/index.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
